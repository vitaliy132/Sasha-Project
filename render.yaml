services:
  - type: web
    name: sasha-project
    env: node
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: true
      - key: WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CRM_EMAIL
        sync: false
      # Optional: visible "To" for lead mail (e.g. leads@em9990.rvvacations.com). CRM_EMAIL is Bcc'd
      # so a personal Gmail is not shown as the primary recipient. Omit to keep To = CRM_EMAIL.
      - key: LEAD_EMAIL_TO
        sync: false
      # Optional: use SendGrid instead of SMTP for outbound lead mail
      - key: SENDGRID_API_KEY
        sync: false
      # Full SendGrid sender address.
      - key: SENDGRID_FROM
        value: quote@rvvacations.com
      - key: SENDGRID_FROM_NAME
        sync: false
