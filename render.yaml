services:
  - type: web
    name: sasha-project
    env: node
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: true
      - key: WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CRM_EMAIL
        sync: false
      # Optional: use SendGrid instead of SMTP for outbound lead mail
      - key: SENDGRID_API_KEY
        sync: false
      # Full address verified in SendGrid, e.g. leads@em9990.rvvacations.com
      - key: SENDGRID_FROM
        sync: false
      - key: SENDGRID_FROM_NAME
        sync: false
